name: Generate AdGuard Home Whitelist

on:
  push:
    paths:
      - 'whitelist.txt' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Convert domains to AdGuard Home Whitelist syntax
        run: |
          OUTPUT_FILE="allowlist.txt"
          
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat << EOF > $OUTPUT_FILE
          ! Title: Whitelist for HaGeZi Pro DNS Blocklist
          ! Description: Whitelist rules when using HaGeZi's Pro DNS Blocklist
          ! Homepage: https://github.com/${{ github.repository }}
          ! Last Modified: ${NOW}
          ! Syntax: AdGuard Home Filter Rules
          ! --------------------------------------------------

          EOF

          sed -E '/^[[:space:]]*$/d; /^[[:space:]]*#/d; s/^[[:space:]]*//; s/[[:space:]]*$//' whitelist.txt \
            | sort -u \
            | sed 's/^(.*)$/@@||\1^/' >> $OUTPUT_FILE

      - name: Commit and Push generated allowlist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add allowlist.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate AdGuard Home whitelist with metadata" && git push)